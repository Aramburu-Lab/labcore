[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labcore"
version = "0.3.3"
description = "Shared lab logic: figure themes, provenance-carrying IO, frame helpers, and the labdocs codebase-documentation engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rytis Stakaitis", email = "rytis.stakaitis@umu.se" }]

# Deliberately narrow. labcore is pinned by tag in consuming projects, so its
# own bounds stay loose (build plan §8: pin tightly downstream, loosely here).
dependencies = [
  "polars>=1.43,<2",
  "pyyaml>=6",
  "jsonschema>=4",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8", "plotly>=5.20"]
io = ["duckdb>=1.0", "pyarrow>=16"]
stats = ["scipy>=1.11"]
all = ["labcore[viz,io,stats]"]
dev = ["labcore[all]", "pytest>=8", "pandas>=2", "ruff>=0.16.2"]

[project.scripts]
labdocs = "labcore.labdocs.cli:main"

[tool.hatch.build.targets.wheel]
# The JSON Schema and report stylesheet live INSIDE the package directory, so
# hatchling ships them as package data automatically. A force-include here would
# add them a second time and hard-fail the wheel build with a duplicate-path
# error — which an editable install never surfaces.
packages = ["src/labcore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
