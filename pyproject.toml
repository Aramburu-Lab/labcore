[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labcore"
version = "0.1.0"
description = "Shared lab logic: figure themes, provenance-carrying IO, frame helpers, and the labdocs codebase-documentation engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rytis Stakaitis", email = "rytis.stakaitis@umu.se" }]

# Deliberately narrow. labcore is pinned by tag in consuming projects, so its
# own bounds stay loose (build plan §8: pin tightly downstream, loosely here).
dependencies = [
  "polars>=1.43,<2",
  "pyyaml>=6",
  "jsonschema>=4",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8", "plotly>=5.20"]
io = ["duckdb>=1.0", "pyarrow>=16"]
stats = ["scipy>=1.11"]
all = ["labcore[viz,io,stats]"]
dev = ["labcore[all]", "pytest>=8", "pandas>=2", "ruff>=0.16.2"]

[project.scripts]
labdocs = "labcore.labdocs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/labcore"]

# The JSON Schema and report stylesheet ship as package data, not as Copier
# template files: schema and parser must version together (build plan §5.2).
[tool.hatch.build.targets.wheel.force-include]
"src/labcore/labdocs/schema" = "labcore/labdocs/schema"
"src/labcore/labdocs/assets" = "labcore/labdocs/assets"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
