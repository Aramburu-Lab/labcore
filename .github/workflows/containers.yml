# Build the reference analysis image, publish it two ways, and verify the claim
# the whole archive story rests on.
#
# ADR-7: publish BOTH the OCI image and a pre-converted .sif as an ORAS artifact.
# Apptainer's own docs state that pulling the same docker:// tag twice does not
# give byte-identical output (conversion metadata such as dates varies), whereas
# an oras:// pull "always gives you an exact copy". That claim had never been
# tested on any machine; the last job here tests it.

name: containers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# GHCR rejects a mixed-case repository name, and github.repository_owner is
# "Aramburu-Lab". Lowercased once here rather than at each use site.
env:
  IMAGE: ghcr.io/aramburu-lab/labcore
  SIF_ARTIFACT: ghcr.io/aramburu-lab/labcore-sif

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          V=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          [ -n "$V" ] || { echo "no version in pyproject.toml"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "building labcore $V"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Context is the repo root: the Dockerfile COPYs pixi.toml and pixi.lock
      # from there. linux/amd64 only — the cluster is x86_64, and an arm64 image
      # pulls happily and then dies with an exec format error (D-004).
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/labcore.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 1.5 GB, Rytis's call 2026-08-12, replacing the build plan's 500 MB — which was
      # written for "a single-tool image" and is unreachable for a scientific stack.
      # The floor here is the libraries: polars' runtime 208 MB, duckdb 59, scipy 57,
      # plotly 42. Waste was removed first, not accommodated: 2080 -> 1077 MB by taking
      # Qt out of a headless image, dropping Arrow's dataset/S3 layers, and stripping
      # test suites, headers and static archives.
      #
      # The ceiling is a REGRESSION detector, not a target. At 1077 MB there is ~400 MB
      # of headroom; a build that reaches 1500 has almost certainly pulled a GUI or
      # Arrow stack back in rather than legitimately grown.
      - name: Acceptance — size, bash, ps
        env:
          MAX_MB: 1500
        run: |
          IMG="${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
          docker pull -q "$IMG"
          BYTES=$(docker image inspect "$IMG" --format '{{.Size}}')
          MB=$(( BYTES / 1000000 ))
          echo "image size: ${MB} MB (ceiling ${MAX_MB} MB)"
          [ "$MB" -lt "$MAX_MB" ] || { echo "::error::image is ${MB} MB, over the ${MAX_MB} MB ceiling"; exit 1; }
          # Nextflow requires both inside the image; distroless would fail here.
          docker run --rm --entrypoint bash "$IMG" --version | head -1
          docker run --rm --entrypoint ps   "$IMG" --version 2>&1 | head -1
          docker run --rm "$IMG"

  oras:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install apptainer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer
          apptainer --version

      - name: Convert to .sif and push as an ORAS artifact
        env:
          V: ${{ needs.build.outputs.version }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | apptainer registry login -u "${{ github.actor }}" --password-stdin oras://ghcr.io
          # --fakeroot is unavailable on HPC2N, which is why this happens here and
          # not on the cluster (ADR-7).
          apptainer build labcore.sif "docker://${{ env.IMAGE }}:${V}"
          apptainer push labcore.sif "oras://${{ env.SIF_ARTIFACT }}:${V}"

      # THE ADR-7 TEST. Two pulls of the same oras:// artifact must be byte-identical.
      # If they are not, the reproducibility argument for archiving a .sif with a
      # manuscript collapses and the distribution story needs rethinking — so this
      # fails the build rather than warning.
      - name: ADR-7 — is an oras:// pull byte-identical?
        env:
          V: ${{ needs.build.outputs.version }}
        run: |
          mkdir -p a b
          apptainer pull a/x.sif "oras://${{ env.SIF_ARTIFACT }}:${V}"
          apptainer pull b/x.sif "oras://${{ env.SIF_ARTIFACT }}:${V}"
          A=$(sha256sum a/x.sif | cut -d' ' -f1)
          B=$(sha256sum b/x.sif | cut -d' ' -f1)
          echo "pull 1: $A"
          echo "pull 2: $B"
          if [ "$A" = "$B" ]; then
            echo "::notice::ADR-7 HOLDS — two oras:// pulls are byte-identical"
          else
            echo "::error::ADR-7 IS FALSE — two oras:// pulls of the same artifact differ."
            exit 1
          fi
          echo "ORAS_SHA=$A" >> "$GITHUB_ENV"

      # The contrast ADR-7 actually rests on: the same claim for docker:// is
      # expected to FAIL. Recorded, never fatal — it is the control, not the test.
      - name: Control — docker:// conversion is not reproducible
        continue-on-error: true
        env:
          V: ${{ needs.build.outputs.version }}
        run: |
          apptainer build c.sif "docker://${{ env.IMAGE }}:${V}"
          apptainer build d.sif "docker://${{ env.IMAGE }}:${V}"
          C=$(sha256sum c.sif | cut -d' ' -f1); D=$(sha256sum d.sif | cut -d' ' -f1)
          echo "docker:// build 1: $C"
          echo "docker:// build 2: $D"
          [ "$C" = "$D" ] && echo "::warning::docker:// WAS reproducible here — ADR-7's contrast is weaker than documented" \
                          || echo "::notice::docker:// differs across builds, as ADR-7 describes"

      - name: Write digests.lock
        env:
          V: ${{ needs.build.outputs.version }}
        run: |
          OCI=$(docker buildx imagetools inspect "${{ env.IMAGE }}:${V}" --format '{{.Manifest.Digest}}' 2>/dev/null || echo "${{ needs.build.outputs.digest }}")
          {
            echo "# Generated by .github/workflows/containers.yml — do not hand-edit."
            echo "# Digest-pinned references for anything archived with a manuscript."
            echo "# A docker.io tag must never appear here (D-004)."
            echo ""
            echo "${{ env.IMAGE }}@${OCI}"
            echo "oras://${{ env.SIF_ARTIFACT }}:${V}  sha256:${ORAS_SHA}"
          } > containers/digests.lock
          cat containers/digests.lock

      - uses: actions/upload-artifact@v4
        with:
          name: digests.lock
          path: containers/digests.lock
